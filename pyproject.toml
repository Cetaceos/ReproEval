[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hy3-reproeval"
version = "0.25.0"
description = "Evidence-grounded Hy3 application generation and evaluation for open-ended research reports"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Cetaceos" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=1.28.1,<2",
  "openai>=2.45,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
hy3-reproeval = "hy3_reproeval.cli:main"
hy3-reproeval-mcp = "hy3_reproscope_mcp.server:main"
hy3-reproscope-mcp = "hy3_reproscope_mcp.server:main"

[project.urls]
Repository = "https://github.com/Cetaceos/ReproEval"
Issues = "https://github.com/Cetaceos/ReproEval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hy3_reproeval", "src/hy3_reproscope_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/scripts",
  "/tests",
  "/.env.example",
  "/.mcp.json",
  "/examples",
  "/evals",
  "/docs",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/README_CN.md",
  "/requirements.lock",
  "/pyproject.toml",
]
exclude = [
  "/docs/**/*.mp4",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
