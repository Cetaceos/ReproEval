<text x="642.0" y="514" text-anchor="middle" class="axis">0.6</text>
<line x1="756.0" y1="115" x2="756.0" y2="489" class="grid"/>
<text x="756.0" y="514" text-anchor="middle" class="axis">0.8</text>
